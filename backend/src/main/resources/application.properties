# ==============================================================================
# SERVER CONFIGURATION
# ==============================================================================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# ==============================================================================
# APPLICATION METADATA
# ==============================================================================
spring.application.name=online-coding-platform

# ==============================================================================
# MYSQL DATABASE CONFIGURATION
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/coding_platform_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP) Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ==============================================================================
# JPA / HIBERNATE CONFIGURATION
# ==============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==============================================================================
# JWT SECURITY CONFIGURATION
# ==============================================================================
# 256-bit Hex/Base64 Key for HMAC-SHA256 signature
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Expiration: 24 Hours in milliseconds (86,400,000 ms)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==============================================================================
# LOGGING CONFIGURATION
# ==============================================================================
logging.level.root=INFO
logging.level.com.oj.platform=DEBUG
