# ==============================================================================
# H2 EMBEDDED DEV PROFILE (Instant Run without MySQL installation)
# ==============================================================================
spring.datasource.url=jdbc:h2:file:./data/coding_platform_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# AI Configuration
app.ai.enabled=${AI_ENABLED:true}
app.ai.api-key=${AI_API_KEY:}
app.ai.api-url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
app.ai.model=${AI_MODEL:gpt-4o-mini}
app.ai.timeout-ms=${AI_TIMEOUT_MS:30000}
